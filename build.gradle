plugins {
    id 'java'
    id 'application'
}

group = 'sk.bomberman'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'Main'
}

// Source layout: Java + resources both live under src/
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
            exclude 'META-INF/MANIFEST.MF'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// Fat JAR: bundle libs so the game runs from a single jar
jar {
    manifest {
        attributes 'Main-Class': 'Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Convenience alias: `./gradlew run` starts the game
run {
    // ShapesGE opens a Swing window — keep stdin open
    standardInput = System.in
}
